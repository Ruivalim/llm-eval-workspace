[project]
name = "llm-eval-workspace"
version = "0.1.0"
description = "Local-first workspace for qualitative LLM evaluation: fixed prompt battery, live streaming, telemetry, auto checks"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rui Valim" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "anthropic>=1.9",
  "openai>=1.60",
  "tiktoken>=0.14",
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.urls]
Repository = "https://github.com/Ruivalim/llm-eval-workspace"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.16",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
# PEP 639 (SPDX `license`) needs setuptools 77 or newer.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llm_eval*"]

