- id: fix-off-by-one
  category: coding
  eval_type: text
  tags: [javascript, bugfix]
  check:
    type: js_harness
    must_not_contain: ["items[i + 1]"]
    must_match: ["function\\s+total"]
    harness: |
      if (total([1,2,3]) !== 6) throw new Error("total([1,2,3]) != 6");
      if (total([]) !== 0) throw new Error("total([]) != 0");
  locales:
    en:
      name: Fix the off-by-one bug
      system_prompt: ""
      prompt: |
        Fix the bug in this JavaScript function. Reply with only the fixed code, no explanation:

        function total(items) {
          let s = 0;
          for (let i = 0; i < items.length; i++) {
            s += items[i + 1];
          }
          return s;
        }
    pt-BR:
      name: Corrige o bug de off-by-one
      system_prompt: ""
      prompt: |
        Corrija o bug nesta função JavaScript. Responda só com o código corrigido, sem explicação:

        function total(items) {
          let s = 0;
          for (let i = 0; i < items.length; i++) {
            s += items[i + 1];
          }
          return s;
        }

